
services:
  db:
    image: postgres:16
    container_name: alfa_hack_postgres
    environment:
      POSTGRES_DB: alfa_news
      POSTGRES_USER: alfa_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_user -d alfa_news"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alfa_hack_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://alfa_user:${POSTGRES_PASSWORD}@db:5432/alfa_news
    volumes:
      - ./data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alfa_hack_frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
