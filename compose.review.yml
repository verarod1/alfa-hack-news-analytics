# Isolated synthetic acceptance environment. Never reads .env or private data.
name: alfa-review

x-review-env: &review-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: alfa_review
  POSTGRES_USER: review
  POSTGRES_PASSWORD: synthetic-local-only
  DEMO_COMPANY_IDS: U_44564,U_19717,U_9250
  FEED_INCLUDE_SYNTHETIC: "true"
  NEWS_MAX_AGE_DAYS: "0"
  ML_ADAPTER_MODULE: ml_test_adapter
  PYTHONPATH: /app/tests:/app
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
  BANK_MATERIALS_PATH: ""
  CORS_ORIGINS: http://localhost:3100,http://127.0.0.1:3100

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: alfa_review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: synthetic-local-only
    volumes:
      - review_db:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/db/mvp.sql:/docker-entrypoint-initdb.d/02-mvp.sql:ro
      - ./backend/fixtures/review.sql:/docker-entrypoint-initdb.d/03-review.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d alfa_review && psql -U review -d alfa_review -tAc \"SELECT count(*) = 3 FROM news WHERE is_synthetic\" | grep -qx t"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./backend
    image: alfa-review-backend:local
    environment: *review-env
    ports: ["127.0.0.1:8100:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=json.load(urllib.request.urlopen('http://localhost:8000/api/v1/demo-profiles')); assert len(r['items']) == 6"]
      interval: 5s
      timeout: 10s
      retries: 30
  analysis-worker:
    build: ./backend
    image: alfa-review-backend:local
    environment: *review-env
    command: ["python", "-u", "scripts/analysis_worker.py"]
    depends_on:
      backend:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3100:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/demo && wget -q -O /dev/null http://127.0.0.1/api/v1/demo-profiles"]
      interval: 5s
      timeout: 5s
      retries: 30
  smoke:
    profiles: ["check"]
    image: alfa-review-backend:local
    environment: *review-env
    command: ["python", "scripts/review_smoke.py", "--base-url", "http://frontend"]
    depends_on:
      frontend:
        condition: service_healthy
      analysis-worker:
        condition: service_started

volumes:
  review_db:
